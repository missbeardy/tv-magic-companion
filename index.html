<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FieldBourne — field service CRM for Australian trade businesses" />
    <meta name="theme-color" content="#004B93" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FieldBourne" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>FieldBourne</title>
    <script>
      (function () {
        var path = location.pathname
        var isPublic =
          /^\/(visualise|privacy|terms|delete-account)(\/|$)/.test(path) ||
          /^\/(quote|invoice)\//.test(path)
        if (!isPublic) return
        var manifest = document.querySelector('link[rel="manifest"]')
        if (manifest) manifest.remove()
        document
          .querySelectorAll('meta[name="apple-mobile-web-app-capable"],meta[name="mobile-web-app-capable"]')
          .forEach(function (el) {
            el.setAttribute('content', 'no')
          })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
