# Catches the class of outage that nothing else here can see: production drifting
# away from this repo. `supabase/functions/*` ships only via a manual deploy, and a
# missing env var makes several code paths fail closed and report success anyway —
# so both are invisible to CI, to tests, and to anyone reading the tree.
#
# Runs on push to main because a merge touching an edge function creates drift at
# that exact moment, and daily because a secret can be removed with no commit at all.
#
# Repo secrets: SUPABASE_ACCESS_TOKEN (sbp_… personal access token), VERCEL_TOKEN.
# Repo variables: VERCEL_PROJECT_ID, VERCEL_TEAM_ID — .vercel/ is gitignored, so CI
# cannot read them from the linked project the way a local run does.
#
# Without VERCEL_TOKEN the Vercel half prints SKIPPED rather than passing quietly.
name: Prod config audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift check compares each function's deployment date against its last
          # commit, so it needs real history. A shallow clone silently reports every
          # function as having no git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Not-yet-configured is not the same as broken. Without the token the audit
      # cannot run at all, and hard-failing the job turns "you haven't added the
      # secret" into a red email on every single push — noise that gets the whole
      # workflow muted, which costs more than the check is worth. Warn instead:
      # visible in the run summary, no notification.
      - name: Check the audit is configured
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Prod config audit not armed::SUPABASE_ACCESS_TOKEN is not set, so nothing was checked. This is not a pass."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit deployed config against the repo
        if: steps.config.outputs.armed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: npm run audit:prod
