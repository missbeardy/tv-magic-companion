# Retention purges — isolated from the 15-minute contact-follow-up job.
# Repo secrets: PLATFORM_URL (e.g. https://tv-magic-companion.vercel.app), CRON_SECRET
name: Cron maintenance

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  cron-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/maintenance
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PLATFORM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing PLATFORM_URL or CRON_SECRET in repo secrets"
            exit 1
          fi
          curl --fail-with-body --max-time 55 -X POST "${PLATFORM_URL%/}/api/cron/maintenance" \
            -H "Authorization: Bearer ${CRON_SECRET}"
