# Recovers 3CX voicemails that CloudMailin rejected for exceeding 524,288 bytes
# (roughly 25 seconds of speech). Reads the originals straight from the mailbox.
# Vercel crons are daily-only on Hobby, hence GitHub Actions.
# Repo secrets: PLATFORM_URL (e.g. https://tv-magic-companion.vercel.app), CRON_SECRET
name: Voicemail poll cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  voicemail-poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/voicemail-poll
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PLATFORM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: set PLATFORM_URL and CRON_SECRET in repo secrets"
            exit 0
          fi
          curl -fsS -X POST "${PLATFORM_URL%/}/api/cron/voicemail-poll" \
            -H "Authorization: Bearer ${CRON_SECRET}"
